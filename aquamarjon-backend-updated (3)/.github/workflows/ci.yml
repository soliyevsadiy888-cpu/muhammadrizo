name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Отдельным шагом, а не только внутри `npm run build` — так в логах PR
      # сразу видно, упал именно тайпчек или что-то другое (см. тот же
      # приём в CI фронтенда).
      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:test

      # Тесты сами поднимают express-приложение через supertest на
      # временных SQLite-файлах (см. tests/helpers/testApp.ts) — реальный
      # порт/сеть/секреты не нужны, JWT_SECRET и DATABASE_PATH тесты
      # выставляют себе сами.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
